# Single-host production layout (docs/production-deployment.md). Nothing here has been deployed.
#   docker compose -f deploy/docker-compose.prod.yml --env-file /etc/avc/production.env up -d --build
# PostgreSQL is never published to the network; only Caddy listens publicly (80/443).
name: avc-prod

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      STORE_A_DB_PASSWORD: ${STORE_A_DB_PASSWORD:?required}
      STORE_B_DB_PASSWORD: ${STORE_B_DB_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    env_file: ${AVC_ENV_FILE:?path to production.env}
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    command: ["python", "-m", "app.worker", "--interval", "5"]
    env_file: ${AVC_ENV_FILE:?path to production.env}
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    environment:
      STORE_A_DOMAIN: ${STORE_A_DOMAIN:?required}
      STORE_B_DOMAIN: ${STORE_B_DOMAIN:?required}
      ACME_EMAIL: ${ACME_EMAIL:?required}
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [api]
    restart: unless-stopped
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
