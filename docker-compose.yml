# Local development database for ai-voice-commerce only.
# Reuses the postgres:15-alpine image already present on this machine.
name: ai-voice-commerce

services:
  postgres:
    image: postgres:15-alpine
    container_name: avc_postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      STORE_A_DB_PASSWORD: ${STORE_A_DB_PASSWORD:?set in .env}
      STORE_B_DB_PASSWORD: ${STORE_B_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - avc_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  avc_pgdata:
